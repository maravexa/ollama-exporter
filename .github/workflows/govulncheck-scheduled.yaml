name: Govulncheck Scheduled

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test vulnerability gate
        shell: bash
        run: python3 -m unittest discover -s scripts -p 'test_vulnerability_gate.py' -v 2>&1 | tee vulnerability-gate-tests.log

      - name: Assess production vulnerabilities
        run: python3 scripts/vulnerability_gate.py --output vulnerability-results

      - name: Retain vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-results-${{ github.job }}
          path: |
            vulnerability-results/
            vulnerability-gate-tests.log
          if-no-files-found: error
